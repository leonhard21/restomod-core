services:

  # ─── Banco de Dados ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: oficina_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: oficina_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oficina_net

  # ─── Backend (Node.js + Express + Prisma) ─────────────────────
  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: oficina_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/oficina_db
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-troque_por_um_segredo_forte_e_aleatorio}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - oficina_net

  # ─── Frontend (Node.js + Next.js) ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        # O browser do usuário acessa o n8n diretamente via localhost
        NEXT_PUBLIC_N8N_WEBHOOK_URL: http://localhost:5678/webhook/assistente
    container_name: oficina_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - n8n
    networks:
      - oficina_net

  # ─── n8n (Automação + IA Gemini) ──────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: oficina_n8n
    restart: always
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      # WEBHOOK_URL deve ser o endereço pelo qual o BROWSER consegue atingir o n8n
      # Em dev local: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_MCP_ENABLED: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows/assistente-gemini.json:/init/assistente-gemini.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MARKER="/home/node/.n8n/.workflow-imported"
        echo ">>> n8n: aguardando backend..."
        for attempt in $(seq 1 30); do
          if node -e "require('http').get('http://backend:8080/api/assistente/contexto',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"; then
            echo ">>> n8n: backend disponivel"
            break
          fi
          echo ">>> n8n: tentativa $$attempt/30, aguardando 3s..."
          sleep 3
        done
        if [ ! -f "$$MARKER" ]; then
          echo ">>> n8n: importando workflow..."
          if n8n import:workflow --input=/init/assistente-gemini.json; then
            touch "$$MARKER"
            echo ">>> n8n: workflow importado"
          else
            echo ">>> n8n: importacao do workflow falhou, mas o servidor continuara"
          fi
        else
          echo ">>> n8n: workflow ja importado, pulando importacao"
        fi
        echo ">>> n8n: iniciando servidor..."
        exec n8n start
    depends_on:
      - backend
    networks:
      - oficina_net

# ─── Volumes persistentes ────────────────────────────────────────
volumes:
  pgdata:
  n8n_data:

# ─── Rede interna ────────────────────────────────────────────────
networks:
  oficina_net:
    driver: bridge
